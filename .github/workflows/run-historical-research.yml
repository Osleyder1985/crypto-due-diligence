name: Run historical crypto research

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Ticker (Binance Spot pair TICKERUSDT)"
        required: true
        default: "BTC"
        type: string
      start_date:
        description: "Start date, UTC, inclusive (YYYY-MM-DD)"
        required: true
        default: "2026-07-01"
        type: string
      end_date:
        description: "End date, UTC, inclusive (YYYY-MM-DD)"
        required: true
        default: "2026-09-21"
        type: string
      interval:
        description: "OHLCV candle interval"
        required: true
        default: "1h"
        type: choice
        options:
          - 1h
          - 4h
          - 1d
          - 15m
          - 30m
          - 5m
          - 1m

permissions:
  contents: read

jobs:
  historical-research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate inputs
        env:
          SYMBOL: ${{ inputs.symbol }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          python - <<'PY'
          import os
          import re
          from datetime import date
          symbol = os.environ["SYMBOL"].strip().upper()
          if not re.fullmatch(r"[A-Z0-9]{2,20}", symbol):
              raise SystemExit("Ticker must contain 2-20 letters or digits.")
          try:
              start = date.fromisoformat(os.environ["START_DATE"])
              end = date.fromisoformat(os.environ["END_DATE"])
          except ValueError as exc:
              raise SystemExit(f"Dates must use YYYY-MM-DD: {exc}")
          if start.isoformat() != os.environ["START_DATE"] or end.isoformat() != os.environ["END_DATE"]:
              raise SystemExit("Dates must use the exact YYYY-MM-DD format.")
          if start > end:
              raise SystemExit("Start date must be on or before end date.")
          print(f"Validated {symbol}, {start} through {end} (UTC, inclusive).")
          PY

      - name: Install dependencies
        run: python -m pip install "jsonschema>=4.18,<5"

      - name: Run autonomous market and event research
        env:
          SYMBOL: ${{ inputs.symbol }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          INTERVAL: ${{ inputs.interval }}
        run: |
          mkdir -p artifacts/autonomous-research artifacts/event-study
          python autonomous_research.py "$SYMBOL" "$START_DATE" "$END_DATE" \
            --interval "$INTERVAL" \
            --output-dir artifacts/autonomous-research \
            --cases-path /tmp/crypto-due-diligence-historical-cases.json \
            --prediction-memory-path /tmp/crypto-due-diligence-prediction-memory.json

      - name: Run standalone event study
        env:
          SYMBOL: ${{ inputs.symbol }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          INTERVAL: ${{ inputs.interval }}
        run: |
          python event_study.py "$SYMBOL" "$START_DATE" "$END_DATE" \
            --interval "$INTERVAL" --output-dir artifacts/event-study

      - name: Upload research reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-research-${{ inputs.symbol }}-${{ inputs.start_date }}-${{ inputs.end_date }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
