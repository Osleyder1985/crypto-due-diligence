name: Validate evidence and research pipeline

on:
  pull_request:
    paths:
      - "schemas/**"
      - "tests/**"
      - "fixtures/research/**"
      - "semantic_validation.py"
      - "research_pipeline.py"
      - "movement_detection.py"
      - "evidence_collector.py"
      - "hypothesis_evaluation.py"
      - "historical_learning.py"
      - "autonomous_research.py"
      - "prediction_evaluation.py"
      - "docs/prediction-evaluation.md"
      - "docs/autonomous-research.md"
      - "docs/historical-learning.md"
      - "docs/evidence-schema.md"
      - "docs/evidence-validation.md"
      - "docs/research-pipeline.md"
      - "docs/README.md"
      - ".github/workflows/validate-evidence-schema.yml"
  push:
    branches:
      - main
    paths:
      - "schemas/**"
      - "tests/**"
      - "fixtures/research/**"
      - "semantic_validation.py"
      - "research_pipeline.py"
      - "movement_detection.py"
      - "evidence_collector.py"
      - "hypothesis_evaluation.py"
      - "historical_learning.py"
      - "docs/historical-learning.md"
      - "docs/evidence-schema.md"
      - "docs/evidence-validation.md"
      - "docs/research-pipeline.md"
      - "docs/README.md"
      - ".github/workflows/validate-evidence-schema.yml"

permissions:
  contents: read

jobs:
  validate-research-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Validate all synthetic research fixtures
        run: python research_pipeline.py validate-fixtures
      - name: Run schema, semantic and research pipeline tests
        run: python -m unittest discover -s tests -v
