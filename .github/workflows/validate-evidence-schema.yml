name: Validate evidence JSON Schema

on:
  pull_request:
    paths:
      - "schemas/**"
      - "tests/**"
      - "docs/evidence-schema.md"
      - "docs/README.md"
      - ".github/workflows/validate-evidence-schema.yml"
  push:
    branches:
      - main
    paths:
      - "schemas/**"
      - "tests/**"
      - "docs/evidence-schema.md"
      - "docs/README.md"
      - ".github/workflows/validate-evidence-schema.yml"

permissions:
  contents: read

jobs:
  validate-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Run evidence schema contract tests
        run: python -m unittest discover -s tests -v
