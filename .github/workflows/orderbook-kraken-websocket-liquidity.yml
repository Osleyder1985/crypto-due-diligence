name: Kraken WebSocket 1000-level BTC liquidity chart

on:
  push:
    branches:
      - feat/kraken-websocket-depth-1000
  workflow_dispatch:
    inputs:
      snapshots:
        description: "Number of sampled book states"
        required: true
        type: choice
        options: ["60", "120", "300"]
        default: "120"
      range_pct:
        description: "Broad chart window on each side of latest mid-price"
        required: true
        type: choice
        options: ["10", "20", "30"]
        default: "20"

permissions:
  contents: read

jobs:
  websocket-liquidity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install order-book and chart dependencies
        run: |
          python -m pip install -r requirements-orderbook.txt
          python -m pip install matplotlib
      - name: Test WebSocket book state and existing analytics
        run: |
          python -m unittest discover -s tests -p "test_orderbook_kraken_websocket.py" -v
          python -m unittest discover -s tests -p "test_orderbook_persistence.py" -v
          python -m unittest discover -s tests -p "test_orderbook_nearby_support_resistance.py" -v
          python -m unittest discover -s tests -p "test_liquidity_support_resistance_chart.py" -v
      - name: Collect Kraken WebSocket v2 book at 1000 levels per side
        env:
          SNAPSHOTS: ${{ inputs.snapshots || '120' }}
        run: |
          python -m orderbook.kraken_websocket_collector --pair BTC/USD --snapshots "$SNAPSHOTS" --interval-seconds 5 --output-dir artifacts/orderbook-ws
      - name: Calculate persistent candidate zones
        run: |
          python -m orderbook.nearby_support_resistance --input artifacts/orderbook-ws/kraken-xbtusd-ws-snapshots.jsonl --output-dir artifacts/orderbook-ws --max-distance-pct 30 --min-persistence-pct 60 --large-concentration-threshold-usd 1000000
      - name: Generate broad-range support and resistance chart
        env:
          RANGE_PCT: ${{ inputs.range_pct || '20' }}
        run: |
          python -m orderbook.liquidity_support_resistance_chart --input artifacts/orderbook-ws/kraken-xbtusd-ws-snapshots.jsonl --zones artifacts/orderbook-ws/kraken-nearby-support-resistance.json --output artifacts/orderbook-ws/btc-liquidity-support-resistance-ws.png --range-pct "$RANGE_PCT"
      - name: Generate near-price detail chart (plus/minus 2 percent)
        run: |
          python -m orderbook.liquidity_support_resistance_chart --input artifacts/orderbook-ws/kraken-xbtusd-ws-snapshots.jsonl --zones artifacts/orderbook-ws/kraken-nearby-support-resistance.json --output artifacts/orderbook-ws/btc-liquidity-support-resistance-detail-ws.png --range-pct 2 --bucket-size 100
      - name: Upload WebSocket snapshots, reports and charts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-websocket-liquidity-${{ github.run_id }}
          path: artifacts/orderbook-ws/
          if-no-files-found: warn
          retention-days: 14
