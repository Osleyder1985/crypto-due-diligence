name: Kraken Spot liquidity persistence monitor

on:
  workflow_dispatch:
    inputs:
      snapshots:
        description: "Number of snapshots to collect (2-20 recommended)"
        required: true
        type: choice
        options:
          - "10"
          - "20"
        default: "20"
      interval_seconds:
        description: "Seconds between snapshots"
        required: true
        type: choice
        options:
          - "15"
          - "30"
          - "60"
        default: "30"
      count:
        description: "Visible levels per side"
        required: true
        type: choice
        options:
          - "100"
          - "250"
          - "500"
        default: "500"

permissions:
  contents: read

jobs:
  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test persistence and nearby-zone calculations
        run: |
          python -m unittest discover -s tests -p 'test_orderbook_persistence.py' -v
          python -m unittest discover -s tests -p 'test_orderbook_nearby_support_resistance.py' -v
      - name: Capture repeated Kraken books and summarize persistence
        env:
          SNAPSHOT_COUNT: ${{ inputs.snapshots }}
          INTERVAL_SECONDS: ${{ inputs.interval_seconds }}
          BOOK_COUNT: ${{ inputs.count }}
        run: |
          set -euo pipefail
          python -m orderbook.persistence_monitor \
            --pair XBTUSD \
            --count "$BOOK_COUNT" \
            --snapshots "$SNAPSHOT_COUNT" \
            --interval-seconds "$INTERVAL_SECONDS" \
            --price-bucket 100 \
            --top-n 20 \
            --min-bucket-notional-usd 250000 \
            --output-dir artifacts/orderbook-persistence
      - name: Rank nearby candidate support and resistance
        run: |
          python -m orderbook.nearby_support_resistance \
            --input artifacts/orderbook-persistence/kraken-xbtusd-snapshots.jsonl \
            --output-dir artifacts/orderbook-persistence \
            --max-distance-pct 20.0 \
            --min-persistence-pct 80 \
            --large-concentration-threshold-usd 1000000
      - name: Validate persistence and nearby-zone reports
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/orderbook-persistence")
          report = json.loads((root / "kraken-liquidity-persistence.json").read_text())
          nearby = json.loads((root / "kraken-nearby-support-resistance.json").read_text())
          lines = (root / "kraken-xbtusd-snapshots.jsonl").read_text().splitlines()
          assert report["snapshot_count"] == len(lines) >= 2
          assert report["venue"] == "kraken_spot"
          assert nearby["snapshot_count"] == len(lines)
          assert float(nearby["reference_mid_price"]) > 0
          assert nearby["notional_threshold_usd"] == "250000"
          assert nearby["large_concentration_threshold_usd"] == "1000000"
          assert nearby["zone_aggregation"].startswith("Aggregated USD notional per $100 price bucket and side")
          assert all("large_concentration_persistence_pct" in zone and "liquidity_classification" in zone for zone in nearby["zones"])
          assert all(zone["status"] == "candidate_unconfirmed" for zone in nearby["zones"])
          print(json.dumps({
              "snapshot_count": report["snapshot_count"],
              "reference_mid_price": nearby["reference_mid_price"],
              "candidate_zone_count": len(nearby["zones"]),
              "persistent_large_concentration_count": sum(zone["liquidity_classification"] == "persistent_large_concentration" for zone in nearby["zones"]),
              "nearby_report": str(root / "kraken-nearby-support-resistance.json"),
          }, indent=2))
          PY
      - name: Upload raw samples and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kraken-xbtusd-persistence-${{ github.run_id }}
          path: artifacts/orderbook-persistence/
          if-no-files-found: error
          retention-days: 14
