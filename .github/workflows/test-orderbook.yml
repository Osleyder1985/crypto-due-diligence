name: Test order book research module

on:
  pull_request:
    paths:
      - "orderbook/**"
      - "tests/test_orderbook_metrics.py"
      - "requirements-orderbook.txt"
      - ".github/workflows/test-orderbook.yml"
  push:
    branches: [main]
    paths:
      - "orderbook/**"
      - "tests/test_orderbook_metrics.py"
      - "requirements-orderbook.txt"
      - ".github/workflows/test-orderbook.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional collector dependency
        run: python -m pip install -r requirements-orderbook.txt
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
