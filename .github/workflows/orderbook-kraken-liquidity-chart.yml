name: Kraken Spot liquidity profile chart

on:
  workflow_dispatch:
    inputs:
      range_pct:
        description: "Price window on each side of the latest mid-price"
        required: true
        type: choice
        options: ["10", "20", "30"]
        default: "20"

permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install plotting dependency
        run: python -m pip install matplotlib
      - name: Test chart and zone calculations
        run: |
          python -m unittest discover -s tests -p "test_orderbook_persistence.py" -v
          python -m unittest discover -s tests -p "test_orderbook_nearby_support_resistance.py" -v
          python -m unittest discover -s tests -p "test_liquidity_support_resistance_chart.py" -v
      - name: Capture repeated Kraken order books
        run: |
          python -m orderbook.persistence_monitor --pair XBTUSD --count 500 --snapshots 20 --interval-seconds 15 --price-bucket 100 --top-n 20 --min-bucket-notional-usd 250000 --output-dir artifacts/orderbook-persistence
      - name: Calculate candidate support and resistance zones
        run: |
          python -m orderbook.nearby_support_resistance --input artifacts/orderbook-persistence/kraken-xbtusd-snapshots.jsonl --output-dir artifacts/orderbook-persistence --max-distance-pct 20 --min-persistence-pct 80 --large-concentration-threshold-usd 1000000
      - name: Generate broad-range liquidity chart
        env:
          RANGE_PCT: ${{ inputs.range_pct }}
        run: |
          python -m orderbook.liquidity_support_resistance_chart --input artifacts/orderbook-persistence/kraken-xbtusd-snapshots.jsonl --zones artifacts/orderbook-persistence/kraken-nearby-support-resistance.json --output artifacts/orderbook-persistence/btc-liquidity-support-resistance.png --range-pct "$RANGE_PCT"
      - name: Upload data, reports and chart
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-support-resistance-chart-${{ github.run_id }}
          path: artifacts/orderbook-persistence/
          if-no-files-found: error
          retention-days: 14
