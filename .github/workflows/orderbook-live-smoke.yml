name: Binance Spot order-book live smoke test

on:
  workflow_dispatch:
    inputs:
      max_events:
        description: "Maximum combined raw depth/trade events"
        required: true
        type: choice
        options:
          - "100"
          - "250"
          - "500"
        default: "250"

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector dependency
        run: python -m pip install -r requirements-orderbook.txt
      - name: Capture bounded public BTCUSDT market data
        env:
          MAX_EVENTS: ${{ inputs.max_events }}
        run: |
          set -euo pipefail
          python -m orderbook.binance_spot_collector \
            --symbol BTCUSDT \
            --output-dir artifacts/orderbook \
            --max-events "$MAX_EVENTS" \
            --reconnect-delay 2
      - name: Generate offline liquidity report
        if: always()
        run: |
          if [ -d artifacts/orderbook ]; then
            python -m orderbook.liquidity_report \
              --symbol BTCUSDT \
              --input-dir artifacts/orderbook \
              --output-dir artifacts/orderbook \
              --price-bucket 100
          fi
      - name: Validate smoke-test evidence
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/orderbook")
          symbol = "btcusdt"

          def records(name):
              path = root / name
              if not path.exists():
                  return []
              with path.open(encoding="utf-8") as handle:
                  return [json.loads(line) for line in handle if line.strip()]

          depth = records(f"{symbol}-depth-events.jsonl")
          trades = records(f"{symbol}-trades.jsonl")
          metrics = records(f"{symbol}-book-metrics.jsonl")
          snapshots = [row for row in depth if row.get("record_type") == "snapshot"]
          valid_metrics = [
              row for row in metrics
              if isinstance(row.get("metrics"), dict)
              and row["metrics"].get("status") == "OK"
          ]
          report_path = root / f"{symbol}-liquidity-report.json"
          report = json.loads(report_path.read_text(encoding="utf-8")) if report_path.exists() else None

          print(json.dumps({
              "depth_records": len(depth),
              "trade_records": len(trades),
              "rest_snapshots": len(snapshots),
              "metric_records": len(metrics),
              "valid_metric_records": len(valid_metrics),
              "report_created": report is not None,
              "report_valid_samples": report.get("valid_book_metric_samples") if report else None,
          }, indent=2))

          assert snapshots, "No REST depth snapshot was persisted"
          assert len(depth) > len(snapshots), "No depth-diff events were captured"
          assert trades, "No public trades were captured"
          assert valid_metrics, "No valid synchronized-book metric was produced"
          assert report is not None, "Liquidity report JSON was not generated"
          assert report["valid_book_metric_samples"] > 0, "Report contains no valid book metrics"
          PY
      - name: Upload raw capture and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-btcusdt-live-smoke-${{ github.run_id }}
          path: artifacts/orderbook/
          if-no-files-found: warn
          retention-days: 14
